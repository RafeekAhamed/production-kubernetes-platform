apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "production-platform.fullname" . }}-backend
  labels:
  {{- include "production-platform.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
  {{- include "production-platform.backendSelectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
  {{- include "production-platform.backendSelectorLabels" . | nindent 8 }}

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: tmp
          emptyDir: {}

      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          env:
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}

            - name: APP_ENV
              value: {{ .Values.app.environment | quote }}

            - name: TMPDIR
              value: /tmp

            - name: DB_HOST
              value: {{ .Values.database.host | quote }}

            - name: DB_PORT
              value: {{ .Values.database.port | quote }}

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.nameKey }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.userKey }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5