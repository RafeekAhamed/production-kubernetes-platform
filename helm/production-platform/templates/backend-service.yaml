apiVersion: v1
kind: Service

metadata:
  name: {{ include "production-platform.fullname" . }}-service
  labels:
    {{- include "production-platform.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "production-platform.backendSelectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP