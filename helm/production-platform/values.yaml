replicaCount: 2

image:
  repository: rafeekahamed/production-kubernetes-platform
  tag: "1.0.3"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

app:
  name: "Production Kubernetes Platform"
  environment: production

database:
  host: postgres-service
  port: 5432
  existingSecret: postgres-secret
  nameKey: POSTGRES_DB
  userKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true